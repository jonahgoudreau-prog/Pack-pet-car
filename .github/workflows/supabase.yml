name: Deploy Supabase

# Applies database migrations and deploys Edge Functions when they change on main,
# so the backend ships from GitHub like the frontend does. Needs the repo secrets
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (see docs/SETUP.md).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The project ref from the Supabase URL. Not a secret.
      SUPABASE_PROJECT_ID: dzafozyfweqyueoyaahi
    steps:
      - uses: actions/checkout@v7

      - name: Check settings
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing. See docs/SETUP.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --use-api
          else
            echo "No Edge Functions yet."
          fi
