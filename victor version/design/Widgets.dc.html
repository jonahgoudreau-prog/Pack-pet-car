<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pack Widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#013E37}a:hover{color:#4A6B65}
.num{font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:800px;height:720px;box-sizing:border-box;background:#C9CBA6;font-family:Urbanist,sans-serif;color:#013E37;padding:28px 32px;display:flex;flex-direction:column;gap:12px">

<div style="font-size:13px;font-weight:800;letter-spacing:0.06em;color:#013E37">HOME SCREEN</div>
<div style="display:flex;gap:20px">

<div style="width:170px;height:170px;box-sizing:border-box;border-radius:26px;background:#013E37;color:#FFEFB3;padding:16px;display:flex;flex-direction:column">
<div style="font-size:13px;font-weight:700;color:#B3BA8E">Milo · streak</div>
<div class="num" style="font-size:64px;line-height:1;margin-top:auto">23</div>
<div style="font-size:14px;font-weight:700;margin-bottom:10px">days fed on time</div>
<div style="display:flex;justify-content:space-between">
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;background:#FFEFB3"></span>
<span style="width:14px;height:14px;border-radius:999px;border:2px solid #FFEFB3;box-sizing:border-box"></span>
</div>
</div>

<div style="width:170px;height:170px;box-sizing:border-box;border-radius:26px;background:#FFF8DE;padding:16px;display:flex;flex-direction:column">
<div style="font-size:13px;font-weight:700;color:#4A6B65">Milo · meals</div>
<div class="num" style="font-size:64px;line-height:1;margin-top:auto">1<span style="color:#4A6B65">/2</span></div>
<div style="align-self:flex-start;margin-top:10px;background:#FF9F5A;color:#013E37;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800">Dinner overdue</div>
</div>

<div style="width:364px;height:170px;box-sizing:border-box;border-radius:26px;background:#013E37;color:#FFEFB3;padding:16px;display:flex;gap:14px">
<div style="flex:1;display:flex;flex-direction:column">
<div style="font-size:13px;font-weight:700;color:#B3BA8E">Milo · today</div>
<div class="num" style="font-size:52px;line-height:1;margin-top:auto">1/2</div>
<div style="font-size:14px;font-weight:700;color:#FF9F5A">Dinner 45 min late</div>
<div style="font-size:13px;font-weight:600;color:#B3BA8E;margin-top:4px">Walks 38 / 60 min</div>
</div>
<div style="width:132px;display:flex;flex-direction:column;gap:8px">
<button style="flex:1;border-radius:18px;border:none;background:#FFEFB3;color:#013E37;font-size:16px;font-weight:800">Fed</button>
<button style="flex:1;border-radius:18px;border:none;background:rgba(255,239,179,0.14);color:#FFEFB3;font-size:16px;font-weight:800">Start walk</button>
</div>
</div>

</div>

<div style="display:flex;gap:20px;margin-top:8px">

<div style="width:364px;height:382px;box-sizing:border-box;border-radius:26px;background:#FFF8DE;padding:20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:2px">
<div style="font-size:13px;font-weight:700;color:#4A6B65">Milo · care score this week</div>
<div class="num" style="font-size:72px;line-height:1">86<span style="font-size:22px;color:#4A6B65;letter-spacing:0"> /100</span></div>
</div>
<div style="background:#013E37;color:#FFEFB3;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800">23-day streak</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:auto">
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Meals on time</span><span class="num">95</span></div><div style="height:8px;border-radius:999px;background:#C9CBA6"><div style="width:95%;height:100%;border-radius:999px;background:#013E37"></div></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Walks</span><span class="num" style="color:#9A4A12">70</span></div><div style="height:8px;border-radius:999px;background:#C9CBA6"><div style="width:70%;height:100%;border-radius:999px;background:#FF9F5A"></div></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Meds</span><span class="num">100</span></div><div style="height:8px;border-radius:999px;background:#C9CBA6"><div style="width:100%;height:100%;border-radius:999px;background:#013E37"></div></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Routine</span><span class="num">80</span></div><div style="height:8px;border-radius:999px;background:#C9CBA6"><div style="width:80%;height:100%;border-radius:999px;background:#013E37"></div></div></div>
</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<div style="font-size:13px;font-weight:800;letter-spacing:0.06em">LOCK SCREEN</div>
<div style="flex:1;border-radius:26px;background:#1E2B28;padding:22px;display:flex;flex-direction:column;gap:16px;color:#FFFFFF">
<div style="display:flex;gap:14px">
<div style="width:76px;height:76px;border-radius:999px;background:rgba(255,255,255,0.14);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative">
<svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Care score 86 of 100" style="position:absolute;inset:0"><circle cx="38" cy="38" r="31" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"></circle><circle cx="38" cy="38" r="31" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="167 195" transform="rotate(-90 38 38)"></circle></svg>
<span class="num" style="font-size:24px;line-height:1">86</span><span style="font-size:10px;font-weight:700">CARE</span>
</div>
<div style="width:76px;height:76px;border-radius:999px;background:rgba(255,255,255,0.14);display:flex;flex-direction:column;align-items:center;justify-content:center">
<span class="num" style="font-size:24px;line-height:1">23</span><span style="font-size:10px;font-weight:700">DAYS</span>
</div>
</div>
<div style="width:180px;box-sizing:border-box;border-radius:18px;background:rgba(255,255,255,0.14);padding:12px 14px;display:flex;flex-direction:column;gap:2px">
<span style="font-size:14px;font-weight:800">Dinner · 45 min late</span>
<span style="font-size:13px;font-weight:600;opacity:0.8">Sam fed breakfast 7:42</span>
</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":720}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
