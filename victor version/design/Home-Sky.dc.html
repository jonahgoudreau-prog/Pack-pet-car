<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pack Home Sky</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0B2E4F}a:hover{color:#4A647C}
.num{font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:405px;height:720px;box-sizing:border-box;background:#DDEEFB;font-family:Urbanist,sans-serif;color:#0B2E4F;padding:44px 24px 108px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden">

<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;flex-direction:column;gap:2px">
<div style="font-size:14px;font-weight:600;color:#4A647C">Tuesday, Oct 20</div>
<div style="font-size:26px;font-weight:800;letter-spacing:-0.02em">Milo</div>
</div>
<button aria-label="Switch pet" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(11,46,79,0.08);background:#F1F8FE;color:#0B2E4F;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">W</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">14</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">T</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">15</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">F</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">16</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">S</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">17</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">S</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0;border-bottom:3px solid #FFB547;box-sizing:border-box">18</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#4A647C">M</span><span class="num" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">19</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:800">Today</span><span class="num" style="width:34px;height:34px;border-radius:999px;background:#0B2E4F;color:#DDEEFB;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0">20</span></div>
</div>

<div style="width:236px;height:236px;align-self:center;border-radius:999px;background:#0B2E4F;color:#DDEEFB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center">
<div style="font-size:14px;font-weight:700;color:#9EBBD6">Dinner</div>
<div class="num" style="font-size:52px;line-height:1">45 min</div>
<div style="font-size:15px;font-weight:700;color:#FFB547">overdue</div>
<button style="margin-top:10px;height:44px;padding:0 24px;border-radius:999px;border:none;background:#DDEEFB;color:#0B2E4F;font-size:16px;font-weight:800">Feed dinner</button>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:auto">
<div style="background:#F1F8FE;border:1px solid rgba(11,46,79,0.08);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:14px;font-weight:700;color:#4A647C">Walks</span>
<span class="num" style="font-size:30px">38<span style="font-size:15px;color:#4A647C;letter-spacing:0"> / 60 min</span></span>
</div>
<div style="background:#F1F8FE;border:1px solid rgba(11,46,79,0.08);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:14px;font-weight:700;color:#4A647C">Meds</span>
<span class="num" style="font-size:30px">8 PM<span style="font-size:15px;color:#4A647C;letter-spacing:0"> next</span></span>
</div>
</div>

<div style="position:absolute;left:24px;right:24px;bottom:22px;height:64px;background:#0B2E4F;border-radius:999px;display:flex;align-items:center;justify-content:space-around;padding:0 12px">
<button aria-label="Today" style="width:48px;height:48px;border:none;background:transparent;color:#DDEEFB;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></button>
<button aria-label="History" style="width:48px;height:48px;border:none;background:transparent;color:#9EBBD6;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Log something" style="width:60px;height:60px;margin-top:-24px;border-radius:999px;border:4px solid #DDEEFB;background:#DDEEFB;color:#0B2E4F;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="Household" style="width:48px;height:48px;border:none;background:transparent;color:#9EBBD6;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.2 2.3 3.5 5.2"></path></svg></button>
<button aria-label="Settings" style="width:48px;height:48px;border:none;background:transparent;color:#9EBBD6;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":405,"height":720}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
